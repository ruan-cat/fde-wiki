name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 提到 job 级：install/split/build 全共享，确保 build 拿到正确 base，
      # 资源路径才指向 /fde-wiki/assets/ 而非根路径（否则线上资源 404、样式全挂）
      VITEPRESS_BASE: /fde-wiki/
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # 冻结锁文件，确保 CI 与本地使用相同的依赖解析结果。
      - run: pnpm install --frozen-lockfile
      # base 由 job 级 env VITEPRESS_BASE 提供
      - run: pnpm split
      - run: pnpm build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
